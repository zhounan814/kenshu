<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="啃书小狗">
<meta name="theme-color" content="#2b1c14">
<title>啃书小狗 · 星露谷风</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ====== 星露谷风格核心变量 ====== */
:root {
  --bg-wood: #2b1c14;        /* 深木背景 */
  --bg-wood-light: #3d271b;  /* 浅木背景 */
  --panel: #f4e4bc;          /* 羊皮纸面板 */
  --border-dark: #1a110a;    /* 极暗边框 */
  --border-light: #8b6b4a;   /* 亮色边框（模拟受光面） */
  --text: #2a1a10;           /* 深色文字 */
  --text-light: #6b4c3a;     /* 浅色文字 */
  --green: #7ba05b;          /* 草绿 */
  --gold: #e4b363;           /* 金币 */
  --red: #c25b56;            /* 砖红 */
  --font: "Courier New", "Microsoft YaHei", monospace;
  --pixel-shadow: 4px 4px 0 var(--border-dark);
  --pixel-inset: inset -4px -4px 0 rgba(0,0,0,0.15), inset 4px 4px 0 rgba(255,255,255,0.4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #110a06; font-family: var(--font); }
body { display: flex; justify-content: center; align-items: center; }

/* 给背景增加像素网格纹理，增加星露谷感 */
.app-bg {
  position: fixed; inset: 0;
  background-color: var(--bg-wood);
  background-image: 
    linear-gradient(45deg, var(--bg-wood-light) 25%, transparent 25%, transparent 75%, var(--bg-wood-light) 75%, var(--bg-wood-light)),
    linear-gradient(45deg, var(--bg-wood-light) 25%, transparent 25%, transparent 75%, var(--bg-wood-light) 75%, var(--bg-wood-light));
  background-size: 20px 20px;
  background-position: 0 0, 10px 10px;
  z-index: -1;
}

.app {
  width: 100%; max-width: 520px; height: 100vh; height: 100dvh;
  position: relative; display: flex; flex-direction: column;
  overflow: hidden;
}

/* ====== 像素风通用组件（星露谷核心质感） ====== */
.pixel-panel {
  background: var(--panel);
  border: 4px solid var(--border-dark);
  box-shadow: var(--pixel-shadow), var(--pixel-inset);
}
.btn {
  background: var(--panel);
  border: 4px solid var(--border-dark);
  box-shadow: var(--pixel-shadow), inset -4px -4px 0 rgba(0,0,0,0.2), inset 4px 4px 0 rgba(255,255,255,0.4);
  color: var(--text); padding: 10px 14px; font-weight: 900; font-size: 14px;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; text-align: center;
  font-family: var(--font); text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
}
.btn:active { 
  transform: translate(4px, 4px); 
  box-shadow: 0 0 0 var(--border-dark), inset 4px 4px 0 rgba(0,0,0,0.2), inset -4px -4px 0 rgba(255,255,255,0.4); 
}
.btn.primary { background: var(--green); color: #fff; text-shadow: 2px 2px 0 var(--border-dark); }
.btn.gold { background: var(--gold); color: #fff; text-shadow: 2px 2px 0 var(--border-dark); }
.btn.red { background: var(--red); color: #fff; text-shadow: 2px 2px 0 var(--border-dark); }
.btn.small { padding: 6px 10px; font-size: 12px; }

/* ====== 页面容器 ====== */
.page { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }

/* ====== 1. 书架页（森林绿/木色） ====== */
#page-shelf .page-header {
  background: #5c8a47; border-bottom: 4px solid var(--border-dark);
  padding: 16px; flex-shrink: 0; color: #fff;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: inset 0 4px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.2);
}
#page-shelf .page-header .title { font-size: 18px; font-weight: 900; letter-spacing: 1px; text-shadow: 2px 2px 0 var(--border-dark); }
#page-shelf .page-header .money { font-size: 14px; font-weight: 900; background: rgba(0,0,0,0.2); padding: 6px 12px; border: 2px solid var(--border-dark); text-shadow: 1px 1px 0 var(--border-dark); }
#page-shelf .cat-bar {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
  background: var(--bg-wood-light); border-bottom: 4px solid var(--border-dark);
  flex-shrink: 0; scrollbar-width: none;
}
#page-shelf .cat-bar::-webkit-scrollbar { display: none; }
#page-shelf .cat-btn {
  flex-shrink: 0; background: var(--panel); border: 4px solid var(--border-dark);
  padding: 8px 16px; font-size: 12px; font-weight: 900; cursor: pointer;
  font-family: var(--font); color: var(--text-light); box-shadow: 2px 2px 0 var(--border-dark);
}
#page-shelf .cat-btn.active { background: #5c8a47; color: #fff; border-color: var(--border-dark); text-shadow: 1px 1px 0 var(--border-dark); }
#page-shelf .cat-btn.add { border-style: dashed; color: var(--gold); }
#page-shelf .book-list { flex: 1; overflow-y: auto; padding: 16px; }
#page-shelf .book-card {
  background: var(--panel); border: 4px solid var(--border-dark);
  box-shadow: var(--pixel-shadow), var(--pixel-inset);
  margin-bottom: 16px; padding: 14px; position: relative;
}
#page-shelf .book-card.sold { opacity: 0.6; background: #d4c9a8; }
#page-shelf .book-card.sold .book-title { text-decoration: line-through; color: var(--red); }
#page-shelf .book-title { font-size: 16px; font-weight: 900; margin-bottom: 4px; color: var(--text); }
#page-shelf .book-meta { font-size: 12px; color: var(--text-light); margin-bottom: 10px; }
#page-shelf .progress-bar { 
  height: 16px; background: #c9b694; border: 3px solid var(--border-dark); margin: 8px 0; 
  box-shadow: inset 0 3px 0 rgba(0,0,0,0.2);
}
#page-shelf .progress-bar .fill { height: 100%; background: var(--green); box-shadow: inset 0 3px 0 rgba(255,255,255,0.3); }
#page-shelf .book-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
#page-shelf .book-actions span { font-size: 12px; font-weight: 900; color: var(--text-light); }
#page-shelf .add-book-btn { flex-shrink: 0; margin: 0 16px 16px 16px; padding: 16px; font-size: 15px; }

/* ====== 2. 记录页（河流蓝/魔法风） ====== */
#page-chat .page-header {
  background: #3a6b8a; border-bottom: 4px solid var(--border-dark);
  padding: 16px; flex-shrink: 0; color: #fff;
  display: flex; align-items: center; gap: 12px;
  box-shadow: inset 0 4px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.2);
}
#page-chat .page-header .dog-avatar { 
  width: 44px; height: 44px; flex-shrink: 0; background: var(--panel); 
  border: 4px solid var(--border-dark); padding: 2px; box-shadow: 2px 2px 0 var(--border-dark);
}
#page-chat .page-header .title { font-size: 18px; font-weight: 900; text-shadow: 2px 2px 0 var(--border-dark); }
#page-chat .chat-list {
  flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
  background: #d7c7a3; /* 旧纸张色 */
}
#page-chat .msg { display: flex; gap: 10px; max-width: 88%; }
#page-chat .msg.dog { align-self: flex-start; }
#page-chat .msg.me { align-self: flex-end; flex-direction: row-reverse; }
#page-chat .msg .avatar {
  width: 40px; height: 40px; background: var(--panel); border: 4px solid var(--border-dark);
  flex-shrink: 0; display: flex; justify-content: center; align-items: center; overflow: hidden;
  box-shadow: 2px 2px 0 var(--border-dark);
}
#page-chat .msg .avatar svg { width: 100%; height: 100%; }
#page-chat .msg .bubble {
  background: var(--panel); border: 4px solid var(--border-dark); box-shadow: 2px 2px 0 var(--border-dark), inset -2px -2px 0 rgba(0,0,0,0.1), inset 2px 2px 0 rgba(255,255,255,0.4);
  padding: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--text);
}
#page-chat .msg.me .bubble { background: #3a6b8a; color: #fff; text-shadow: 1px 1px 0 var(--border-dark); }
#page-chat .chat-input-bar {
  flex-shrink: 0; background: var(--bg-wood-light); border-top: 4px solid var(--border-dark);
  padding: 12px; display: flex; gap: 8px;
}
#page-chat .chat-input-bar input {
  flex: 1; background: var(--panel); border: 4px solid var(--border-dark); padding: 10px;
  font-family: var(--font); font-size: 14px; outline: none; min-width: 0;
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);
}
#page-chat .chat-input-bar button {
  background: #3a6b8a; border: 4px solid var(--border-dark); box-shadow: var(--pixel-shadow);
  color: #fff; font-weight: 900; padding: 10px 16px; cursor: pointer; font-family: var(--font);
  text-shadow: 1px 1px 0 var(--border-dark);
}
#page-chat .chat-input-bar button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--border-dark); }

/* ====== 3. 我的页（魔法紫/魔法书风） ====== */
#page-me .page-header {
  background: #6a5a8a; border-bottom: 4px solid var(--border-dark);
  padding: 16px; flex-shrink: 0; color: #fff;
  box-shadow: inset 0 4px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.2);
}
#page-me .page-header .title { font-size: 18px; font-weight: 900; text-shadow: 2px 2px 0 var(--border-dark); }
#page-me .me-content { flex: 1; overflow-y: auto; padding: 20px; }
#page-me .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 30px; }
#page-me .stat-card {
  background: var(--panel); border: 4px solid var(--border-dark);
  box-shadow: var(--pixel-shadow), var(--pixel-inset);
  padding: 20px 8px; text-align: center;
}
#page-me .stat-card .num { font-size: 18px; font-weight: 900; color: #6a5a8a; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
#page-me .stat-card .label { font-size: 12px; color: var(--text-light); margin-top: 6px; font-weight: 900; }
#page-me .me-actions { display: flex; flex-direction: column; gap: 16px; }
#page-me .me-actions .btn { padding: 20px; font-size: 16px; }

/* ====== 底部导航 ====== */
.tabbar {
  background: var(--panel); border-top: 4px solid var(--border-dark);
  display: flex; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
  z-index: 100; box-shadow: inset 0 4px 0 rgba(255,255,255,0.2);
}
.tab-item {
  flex: 1; padding: 14px 0; border: none; background: none; cursor: pointer;
  font-size: 13px; font-weight: 900; color: var(--text-light); font-family: var(--font);
  border-right: 4px solid var(--border-dark); transition: background 0.2s;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
}
.tab-item:last-child { border-right: none; }
.tab-item.active { background: var(--gold); color: #fff; text-shadow: 2px 2px 0 var(--border-dark); }

/* ====== 弹窗 ====== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
  justify-content: center; align-items: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--panel); border: 4px solid var(--border-dark); box-shadow: 8px 8px 0 var(--border-dark), var(--pixel-inset);
  width: 90%; max-width: 400px; padding: 20px; max-height: 80vh; overflow-y: auto;
}
.modal h3 { font-size: 18px; margin-bottom: 16px; font-weight: 900; text-align: center; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
.modal label { display: block; font-size: 12px; font-weight: 900; margin-bottom: 12px; color: var(--text-light); }
.modal input, .modal select {
  width: 100%; padding: 10px; border: 4px solid var(--border-dark); font-family: var(--font);
  margin-top: 4px; font-size: 14px; outline: none; background: #fff;
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.1);
}
.modal-actions { display: flex; gap: 12px; margin-top: 20px; }
.modal-actions .btn { flex: 1; padding: 14px; }

/* ====== 提示 ====== */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 4px solid var(--border-dark); box-shadow: 4px 4px 0 var(--border-dark), var(--pixel-inset);
  padding: 12px 24px; font-weight: 900; font-size: 14px; z-index: 2000;
  transition: opacity 0.3s; opacity: 0; pointer-events: none; color: var(--text);
}
.toast.show { opacity: 1; }
.empty-tip { text-align: center; color: #d4b88c; font-size: 13px; padding: 40px 20px; font-weight: 900; text-shadow: 1px 1px 0 var(--border-dark); }
</style>
</head>
<body>
<div class="app-bg"></div>

<div class="app">
  <!-- ==================== 1. 书架页 ==================== -->
  <div class="page active" id="page-shelf">
    <header class="page-header">
      <div class="title">📚 我的书架</div>
      <div class="money">💰 总资产：<span id="shelfTotalMoney">¥0</span></div>
    </header>
    <div class="cat-bar" id="catBar"></div>
    <div class="book-list" id="bookList"></div>
    <button class="btn primary add-book-btn" id="addBookBtn">＋ 添加新书</button>
  </div>

  <!-- ==================== 2. 记录页 ==================== -->
  <div class="page" id="page-chat">
    <header class="page-header">
      <div class="dog-avatar">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <g fill="none" stroke="var(--text)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="21" cy="50" rx="9" ry="17"/><ellipse cx="79" cy="50" rx="9" ry="17"/>
            <circle cx="50" cy="50" r="29"/>
            <circle cx="38" cy="44" r="3.6" fill="var(--text)" stroke="none"/>
            <circle cx="62" cy="44" r="3.6" fill="var(--text)" stroke="none"/>
            <ellipse cx="50" cy="59" rx="4.2" ry="3.4" fill="var(--text)" stroke="none"/>
            <path d="M44 67 Q50 72 56 67"/>
          </g>
        </svg>
      </div>
      <div class="title">🐶 记录助手</div>
    </header>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-input-bar">
      <input id="chatInput" type="text" placeholder="如：《活着》价格45元 读了50页" autocomplete="off">
      <button id="chatSendBtn">发送</button>
    </div>
  </div>

  <!-- ==================== 3. 我的页 ==================== -->
  <div class="page" id="page-me">
    <header class="page-header">
      <div class="title">👤 我的数据</div>
    </header>
    <div class="me-content">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="num" id="meTotalMoney">¥0</div>
          <div class="label">总资产</div>
        </div>
        <div class="stat-card">
          <div class="num" id="meTotalBooks">0</div>
          <div class="label">总藏书</div>
        </div>
        <div class="stat-card">
          <div class="num" id="meSoldBooks">0</div>
          <div class="label">已售出</div>
        </div>
      </div>
      <div class="me-actions">
        <button class="btn gold" id="exportBtn">📤 导出数据备份</button>
        <button class="btn" id="importBtn">📥 导入数据恢复</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab-item active" data-page="shelf">📚 书架</button>
    <button class="tab-item" data-page="chat">🐶 记录</button>
    <button class="tab-item" data-page="me">👤 我的</button>
  </nav>
</div>

<!-- 弹窗：添加/编辑书籍 -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h3 id="modalTitle">添加书籍</h3>
    <label>书名 <input id="mTitle" placeholder="例如：海贼王 第一卷"></label>
    <label>出版社 <input id="mPublisher" placeholder="例如：浙江人民美术出版社"></label>
    <div style="display:flex; gap:10px;">
      <label style="flex:1;">价格 (¥) <input id="mPrice" type="number" inputmode="decimal" placeholder="0.00"></label>
      <label style="flex:1;">总页数 <input id="mTotal" type="number" inputmode="numeric" placeholder="0"></label>
    </div>
    <div style="display:flex; gap:10px;">
      <label style="flex:1;">已读页数 <input id="mCurrent" type="number" inputmode="numeric" placeholder="0"></label>
      <label style="flex:1;">分类文件夹 <select id="mCategory"><option value="">无</option></select></label>
    </div>
    <label>阅读进度 <span id="mProgressLabel" style="color:#5c8a47;">0%</span>
      <input id="mProgress" type="range" min="0" max="100" value="0" style="padding:0; border:none; background:transparent; box-shadow:none;">
    </label>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   基础工具
============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 2000);
}

/* ============================================================
   数据状态
============================================================ */
const STORAGE_KEY = 'reading-dog-v6';

function defaultState() {
  return {
    books: [],
    categories: [{ id: 'default', name: '我的书架' }],
    chat: [
      { role: 'dog', text: '汪！我是你的记录助手 🐶\n跟我说句话，我就能帮你把书录入书架！\n你可以说：\n· 《活着》价格45元 出版社人民文学 读了50页\n· 售出《活着》' }
    ]
  };
}

function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}
  
  if (!s) {
    try {
      const oldS = JSON.parse(localStorage.getItem('reading-dog-v5')) || JSON.parse(localStorage.getItem('reading-dog-v4')) || JSON.parse(localStorage.getItem('reading-dog-v1'));
      if (oldS && Array.isArray(oldS.books)) {
        s = defaultState();
        s.books = oldS.books.map(b => ({
          id: b.id || uid(), title: b.title || '未命名', publisher: b.publisher || '',
          price: b.price || 0, progress: b.progress || 0, currentPage: b.currentPage || 0,
          totalPages: b.totalPages || 0, isSold: b.isSold || false, createdAt: b.createdAt || Date.now(),
          categoryId: b.categoryId || 'default'
        }));
        if (oldS.chat) s.chat = oldS.chat;
        if (oldS.categories) s.categories = oldS.categories;
        toast('已自动迁移旧版数据 📦');
      }
    } catch(e) {}
  }
  
  if (!s || !Array.isArray(s.books)) return defaultState();
  if (!Array.isArray(s.chat)) s.chat = defaultState().chat;
  if (!Array.isArray(s.categories)) s.categories = defaultState().categories;
  return s;
}

let state = loadState();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { toast('存储空间不足，请清理或导出备份'); }
}

/* ============================================================
   金额与统计
============================================================ */
function calcTotalMoney() {
  return state.books.filter(b => !b.isSold).reduce((sum, b) => sum + (b.price || 0), 0);
}

function updateAllStats() {
  const money = '¥' + calcTotalMoney().toFixed(2);
  $('#shelfTotalMoney').textContent = money;
  $('#meTotalMoney').textContent = money;
  $('#meTotalBooks').textContent = state.books.length;
  $('#meSoldBooks').textContent = state.books.filter(b => b.isSold).length;
}

/* ============================================================
   1. 渲染书架页
============================================================ */
let activeCategoryId = 'all';

function renderShelf() {
  const catBar = $('#catBar');
  catBar.innerHTML = '';
  
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn' + (activeCategoryId === 'all' ? ' active' : '');
  allBtn.textContent = '全部';
  allBtn.onclick = () => { activeCategoryId = 'all'; renderShelf(); };
  catBar.appendChild(allBtn);

  state.categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (activeCategoryId === c.id ? ' active' : '');
    b.textContent = c.name;
    b.onclick = () => { activeCategoryId = c.id; renderShelf(); };
    catBar.appendChild(b);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'cat-btn add';
  addBtn.textContent = '＋ 文件夹';
  addBtn.onclick = () => {
    const name = prompt('新文件夹名称：');
    if (name && name.trim()) {
      state.categories.push({ id: uid(), name: name.trim() });
      save(); renderShelf();
      toast('已创建文件夹 📁');
    }
  };
  catBar.appendChild(addBtn);

  const list = $('#bookList');
  list.innerHTML = '';
  
  let books = [...state.books];
  if (activeCategoryId !== 'all') {
    books = books.filter(b => b.categoryId === activeCategoryId);
  }
  
  if (books.length === 0) {
    list.innerHTML = '<div class="empty-tip">这里空空的～<br>点下方按钮添加一本书吧 📚</div>';
    return;
  }

  const sorted = books.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  sorted.forEach(b => {
    const el = document.createElement('div');
    el.className = 'book-card' + (b.isSold ? ' sold' : '');
    el.innerHTML = `
      <div class="book-title">${esc(b.title)}</div>
      <div class="book-meta">
        ${esc(b.publisher || '未知出版社')} · ¥${(b.price || 0).toFixed(2)}
      </div>
      <div class="progress-bar"><div class="fill" style="width:${b.progress || 0}%"></div></div>
      <div class="book-actions">
        <span>${b.progress || 0}% (${b.currentPage || 0}/${b.totalPages || 0}页)</span>
        <div style="flex:1;"></div>
        ${!b.isSold ? `
          <button class="btn small" onclick="editBook('${b.id}')">编辑</button>
          <button class="btn small red" onclick="markSold('${b.id}')">售出</button>
        ` : `<button class="btn small" onclick="restoreBook('${b.id}')">撤销售出</button>`}
      </div>
    `;
    list.appendChild(el);
  });
}

/* ============================================================
   2. 渲染记录页
============================================================ */
const LINE_DOG_SVG = `<svg viewBox="0 0 100 100" width="100%" height="100%"><g fill="none" stroke="var(--text)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="21" cy="50" rx="9" ry="17"/><ellipse cx="79" cy="50" rx="9" ry="17"/><circle cx="50" cy="50" r="29"/><circle cx="38" cy="44" r="3.6" fill="var(--text)" stroke="none"/><circle cx="62" cy="44" r="3.6" fill="var(--text)" stroke="none"/><ellipse cx="50" cy="59" rx="4.2" ry="3.4" fill="var(--text)" stroke="none"/><path d="M44 67 Q50 72 56 67"/></g></svg>`;

function renderChat() {
  const box = $('#chatList');
  box.innerHTML = '';
  state.chat.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'me' : 'dog');
    const text = esc(m.text).replace(/\n/g, '<br>');
    d.innerHTML = m.role === 'dog'
      ? `<div class="avatar">${LINE_DOG_SVG}</div><div class="bubble">${text}</div>`
      : `<div class="bubble">${text}</div>`;
    box.appendChild(d);
  });
  requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
}

/* ============================================================
   3. 渲染我的页
============================================================ */
function renderMe() {
  updateAllStats();
}

/* ============================================================
   页面切换
============================================================ */
$$('.tab-item').forEach(tab => {
  tab.onclick = () => {
    const pageName = tab.dataset.page;
    $$('.tab-item').forEach(t => t.classList.toggle('active', t === tab));
    $$('.page').forEach(p => p.classList.remove('active'));
    $(`#page-${pageName}`).classList.add('active');

    if (pageName === 'shelf') { renderShelf(); updateAllStats(); }
    if (pageName === 'chat') { setTimeout(renderChat, 30); }
    if (pageName === 'me') { renderMe(); }
  };
});

/* ============================================================
   书籍操作
============================================================ */
function markSold(id) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  if (confirm(`确定将《${b.title}》标记为售出吗？\n售出后将从总资产中扣除 ¥${(b.price || 0).toFixed(2)}`)) {
    b.isSold = true;
    save(); renderShelf(); updateAllStats();
    toast('已售出，总资产已更新 💰');
  }
}

function restoreBook(id) {
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  b.isSold = false;
  save(); renderShelf(); updateAllStats();
  toast('已撤销售出');
}

let editingBookId = null;

function editBook(id) {
  editingBookId = id;
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  $('#modalTitle').textContent = '编辑书籍';
  $('#mTitle').value = b.title || '';
  $('#mPublisher').value = b.publisher || '';
  $('#mPrice').value = b.price || '';
  $('#mTotal').value = b.totalPages || '';
  $('#mCurrent').value = b.currentPage || '';
  $('#mProgress').value = b.progress || 0;
  
  const sel = $('#mCategory');
  sel.innerHTML = '<option value="">无</option>' + state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  sel.value = b.categoryId || '';

  updateProgressLabel();
  $('#bookModal').classList.add('show');
}

function updateProgressLabel() {
  const v = parseInt($('#mProgress').value) || 0;
  $('#mProgressLabel').textContent = v + '%';
}

$('#mTotal').oninput = $('#mCurrent').oninput = () => {
  const t = parseInt($('#mTotal').value) || 0;
  const c = parseInt($('#mCurrent').value) || 0;
  if (t > 0) {
    const p = clamp(Math.round(c / t * 100), 0, 100);
    $('#mProgress').value = p;
    updateProgressLabel();
  }
};
$('#mProgress').oninput = () => {
  const t = parseInt($('#mTotal').value) || 0;
  if (t > 0) $('#mCurrent').value = Math.round(t * ($('#mProgress').value / 100));
  updateProgressLabel();
};

$('#addBookBtn').onclick = () => {
  editingBookId = null;
  $('#modalTitle').textContent = '添加书籍';
  $('#mTitle').value = '';
  $('#mPublisher').value = '';
  $('#mPrice').value = '';
  $('#mTotal').value = '';
  $('#mCurrent').value = '';
  $('#mProgress').value = 0;
  
  const sel = $('#mCategory');
  sel.innerHTML = '<option value="">无</option>' + state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  sel.value = state.categories[0]?.id || '';
  
  updateProgressLabel();
  $('#bookModal').classList.add('show');
};

$('#modalCancel').onclick = () => $('#bookModal').classList.remove('show');
$('#modalSave').onclick = () => {
  const title = $('#mTitle').value.trim();
  if (!title) { toast('书名不能为空'); return; }
  const data = {
    title,
    publisher: $('#mPublisher').value.trim(),
    price: parseFloat($('#mPrice').value) || 0,
    totalPages: parseInt($('#mTotal').value) || 0,
    currentPage: parseInt($('#mCurrent').value) || 0,
    progress: clamp(parseInt($('#mProgress').value) || 0, 0, 100),
    categoryId: $('#mCategory').value || ''
  };
  if (editingBookId) {
    const b = state.books.find(x => x.id === editingBookId);
    Object.assign(b, data);
  } else {
    state.books.push({ id: uid(), ...data, isSold: false, createdAt: Date.now() });
  }
  save(); renderShelf(); updateAllStats(); $('#bookModal').classList.remove('show');
  toast(editingBookId ? '已保存' : '已加入书架 📚');
};

/* ============================================================
   数据导入导出（我的页）
============================================================ */
function exportData() {
  const dataStr = JSON.stringify(state);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `啃书小狗备份_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('备份已导出！请保存好文件 📁');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const importedState = JSON.parse(e.target.result);
      if (!importedState || !Array.isArray(importedState.books)) {
        throw new Error('文件格式不正确');
      }
      if (confirm('导入将覆盖当前所有数据，确定要继续吗？')) {
        state = importedState;
        if (!Array.isArray(state.chat)) state.chat = defaultState().chat;
        if (!Array.isArray(state.categories)) state.categories = defaultState().categories;
        save(); 
        renderShelf(); renderChat(); renderMe(); updateAllStats();
        toast('数据导入成功！🐶');
      }
    } catch (err) {
      toast('导入失败：' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => { $('#importFile').click(); };
$('#importFile').onchange = importData;

/* ============================================================
   对话指令解析
============================================================ */
function extractTitle(t) {
  let m = t.match(/《([^》]{1,40})》/);
  if (m) return m[1].trim();
  m = t.match(/(?:录入|添加|新书|记录)\s*[：:，,]?\s*([^\s，,。;；、]{1,30})/);
  if (m) {
    let s = m[1].replace(/(价格|价钱|出版社|读了|进度|¥|￥).*$/, '');
    s = s.replace(/\d+(\.\d+)?\s*(元|块|页|%)/g, '');
    if (s) return s.trim();
  }
  return null;
}

function guessTitle(t) {
  let s = t;
  s = s.replace(/(?:价格|价钱|定价|售价|花了|买成|费用)\s*[是为:：]?\s*[¥￥]?\s*\d+(?:\.\d+)?\s*(?:元|块钱|块)?/g, '');
  s = s.replace(/[¥￥]\s*\d+(?:\.\d+)?/g, '');
  s = s.replace(/\d+(?:\.\d+)?\s*(?:元|块钱|块)/g, '');
  s = s.replace(/(?:出版社|出版)\s*[是为:：]?\s*[^\s，,。;；、\d]+/g, '');
  s = s.replace(/(?:读了|读到|看到|已读|读完)\s*\d+(?:\.\d+)?\s*页/g, '');
  s = s.replace(/(?:进度|已读|完成)\s*[是为:：]?\s*\d+(?:\.\d+)?\s*(?:%|％|百分之)/g, '');
  s = s.replace(/\d+(?:\.\d+)?\s*(?:%|％)/g, '');
  s = s.replace(/[，,。;；、\s]+/g, '');
  s = s.replace(/^(加书|添加|新书|记录|录入|加入|我|的|是|看了|读)+/, '');
  s = s.replace(/^[《》]+|[《》]+$/g, '');
  return (s.length >= 1 && s.length <= 20) ? s : null;
}

function extractPrice(t) {
  let m = t.match(/(?:价格|价钱|定价|售价|花了|买成|费用)\s*[是为:：]?\s*[¥￥]?\s*(\d+(?:\.\d+)?)/);
  if (m) return parseFloat(m[1]);
  m = t.match(/[¥￥]\s*(\d+(?:\.\d+)?)/);
  if (m) return parseFloat(m[1]);
  m = t.match(/(\d+(?:\.\d+)?)\s*(?:元|块钱|块)/);
  if (m) return parseFloat(m[1]);
  return null;
}

function extractPublisher(t) {
  const m = t.match(/(?:出版社|出版)\s*[是为:：]?\s*([^\s，,。;；、\d]{2,20})/);
  return m ? m[1].trim() : null;
}

function extractProgress(t) {
  let m = t.match(/(?:读了|读到|看到|已读|读完)\s*(\d+(?:\.\d+)?)\s*页/);
  if (m) return { type: 'page', value: parseFloat(m[1]) };
  m = t.match(/(?:进度|已读|完成)\s*[是为:：]?\s*(\d+(?:\.\d+)?)\s*(?:%|％|百分之)/);
  if (m) return { type: 'percent', value: parseFloat(m[1]) };
  m = t.match(/(\d+(?:\.\d+)?)\s*(?:%|％)/);
  if (m) return { type: 'percent', value: parseFloat(m[1]) };
  return null;
}

function findBook(title) {
  if (!title) return null;
  const exact = state.books.find(b => b.title === title);
  if (exact) return exact;
  const fuzzy = state.books.find(b => b.title.includes(title) || title.includes(b.title));
  if (fuzzy) return fuzzy;
  return null;
}

function doSellReply(t) {
  let title = extractTitle(t) || guessTitle(t);
  if (!title) return '汪？你要售出哪本书呀？\n比如：售出《活着》';
  
  let book = findBook(title);
  if (!book) return `没找到《${title}》这本书呢。\n你是不是想售出别的书？`;
  
  if (book.isSold) return `《${book.title}》已经售出啦，不需要再售出一次。`;
  
  book.isSold = true;
  save(); updateAllStats(); renderShelf();
  return `✅ 已将《${book.title}》标记为售出\n从总资产中扣除 ¥${(book.price || 0).toFixed(2)}\n当前总资产：¥${calcTotalMoney().toFixed(2)}`;
}

const FALLBACKS = [
  '汪？我没太听懂…\n试试这样说：《活着》价格45元 出版社人民文学 读了50页',
  '汪汪！可以这样告诉我：海贼王 1 读了30页',
  '汪～我会记书、算账哦。\n说「售出《活着》」可以标记售出。'
];

function processCommand(text) {
  const t = text.replace(/\s+/g, ' ').trim();

  if (/(售出|卖掉|卖出|售罄)/.test(t)) return doSellReply(t);

  const price = extractPrice(t);
  const publisher = extractPublisher(t);
  const prog = extractProgress(t);
  const hasData = price !== null || publisher !== null || prog !== null;

  let title = extractTitle(t);
  if (!title && hasData) title = guessTitle(t);

  if (!hasData && !title) return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
  if (!title) return '汪？这是要记在哪本书上呀？\n加上书名我就能记住啦，比如：《活着》价格45元';

  let book = findBook(title);
  let isNew = false;

  if (!book) {
    book = {
      id: uid(), title: title, publisher: '', price: 0,
      progress: 0, currentPage: 0, totalPages: 0, isSold: false, createdAt: Date.now(),
      categoryId: state.categories[0]?.id || ''
    };
    state.books.push(book);
    isNew = true;
  }

  const changes = [];
  if (price !== null) { book.price = price; changes.push(`价格 ¥${price}`); }
  if (publisher) { book.publisher = publisher; changes.push(`出版社 ${publisher}`); }

  let finished = false;
  if (prog) {
    let newProgress = book.progress;
    if (prog.type === 'page') {
      book.currentPage = prog.value;
      if (book.totalPages > 0) newProgress = clamp(Math.round(prog.value / book.totalPages * 100), 0, 100);
      else { newProgress = book.progress; changes.push(`读到第 ${prog.value} 页`); }
    } else {
      newProgress = clamp(prog.value, 0, 100);
      if (book.totalPages > 0) book.currentPage = Math.round(book.totalPages * newProgress / 100);
    }

    if (newProgress > book.progress) {
      book.progress = newProgress;
      if (newProgress >= 100) { finished = true; }
    }
    changes.push(`进度 ${Math.round(book.progress)}%`);
  }

  save(); renderShelf(); updateAllStats();

  let reply = '';
  if (isNew) reply += `汪！新书《${book.title}》已经放上书架啦 📚\n`;
  else reply += `收到！《${book.title}》\n`;

  if (changes.length) reply += '· ' + changes.join('\n· ') + '\n';

  if (finished) reply += '\n🎉 恭喜读完这本书！';
  reply += '\n总资产：¥' + calcTotalMoney().toFixed(2);

  return reply;
}

/* ============================================================
   对话逻辑
============================================================ */
function addChat(role, text) {
  state.chat.push({ role, text });
  if (state.chat.length > 150) state.chat.splice(0, state.chat.length - 150);
  save(); renderChat();
}

function sendMessage() {
  const input = $('#chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addChat('user', text);
  setTimeout(() => {
    const reply = processCommand(text);
    addChat('dog', reply);
  }, 350);
}

$('#chatSendBtn').onclick = sendMessage;
$('#chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

/* ============================================================
   初始化
============================================================ */
function init() {
  renderShelf();
  renderChat();
  renderMe();
  updateAllStats();
}

init();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

  window.matchMedia('(display-mode: standalone)').matches ? 'standalone-mode' : 'browser-mode'
);
